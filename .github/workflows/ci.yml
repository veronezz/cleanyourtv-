name: Launcher CI

on:
  push:
    branches: [main, cleanyourtv-plus]
    paths: ['launcher/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and unsigned release
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PciUnsignedRelease=true :app:testReleaseUnitTest :app:assembleRelease
      - name: Check APK size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Unsigned release APK: $size bytes"
          test "$size" -lt 1048576
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-results
          path: launcher/app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
