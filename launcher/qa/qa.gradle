// Optional native UI/cache checks. No test dependency enters the release APK.
allprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application')) {
            project.android.testOptions.unitTests.includeAndroidResources = true
            project.android.sourceSets.test.java.srcDir(new File(project.rootDir, 'qa/src'))
            project.dependencies.add('testImplementation', 'org.robolectric:robolectric:4.14.1')
            project.tasks.withType(Test).configureEach {
                def destination = new File(project.buildDir, 'reports/visual-qa')
                doFirst { destination.mkdirs() }
                systemProperty 'tvhome.qa.output', destination.absolutePath
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { key ->
                    if(System.getProperty(key)!=null)systemProperty key,System.getProperty(key)
                }
            }
        }
    }
}
